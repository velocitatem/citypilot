[project]
name = "invertix-worker"
version = "0.1.0"
description = "Celery worker: runs ETL, provisions sandbox, drives Deep Agent run."
requires-python = ">=3.12"
dependencies = [
    "celery==5.4.0",
    "redis==5.2.1",
    "sqlalchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",
    "minio==7.2.12",
    "docker==7.1.0",
    "duckdb==1.1.3",
    "pandas==2.2.3",
    "langchain>=1.3.0,<2.0.0",
    "langchain-openai>=0.3.0",
    "deepagents==0.6.3",
    "langchain-daytona>=0.0.6",
    "daytona>=0.169.0",
    "qdrant-client>=1.9.0",
    "openai>=1.0.0",
    "boto3>=1.34.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "mcp-open-data-hk>=0.2.3",
]

[tool.uv]
package = false
